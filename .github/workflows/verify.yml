name: verify-source-artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and report audit inventories
        run: |
          python3 scripts/generate_inventory.py
          python3 - <<'PY'
          import hashlib
          import csv
          from pathlib import Path
          paths = [
              "README.md", "README_FA.md", "docs/STATUS.md", "docs/ROADMAP.md", "artifacts/SHA256SUMS.txt",
              "docs/REMOTE_SYNC_CHECKLIST.md", "docs/EXECUTION_PLAN_2026-11-03.md",
              "docs/STRATEGY_RESEARCH_PROGRAM_2026-10-30.md",
              "docs/STRATEGY_RESEARCH_PROGRAM_UPDATE_2026-11-03.md",
              ".github/workflows/verify.yml",
          ]
          for rel in paths:
              data = Path(rel).read_bytes()
              print(f"AUDIT_FILE|{rel}|{len(data)}|{hashlib.sha256(data).hexdigest()}")
          with Path("docs/FILE_INVENTORY_SHA256.csv").open(encoding="utf-8", newline="") as f:
              for row in csv.DictReader(f):
                  if row["path"] in paths:
                      print(f"AUDIT_INVENTORY|{row['path']}|{row['bytes']}|{row['sha256']}")
          PY
      - name: Verify SHA-256 manifests
        run: python3 scripts/verify_sources.py
