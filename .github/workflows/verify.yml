name: verify-source-artifacts

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify inventory regeneration is clean
        run: |
          python3 scripts/generate_inventory.py
          git diff --exit-code -- docs/FILE_INVENTORY_SHA256.csv
      - name: Verify SHA-256 manifests
        run: python3 scripts/verify_sources.py
      - name: Screen repository archives and sensitive content
        run: python3 scripts/audit_archive_contents.py
      - name: Documentation structure (links, index, historical banners, layout)
        run: python3 scripts/check_docs.py
      - name: Mirrored files must not drift
        run: python3 scripts/check_mirrors.py
