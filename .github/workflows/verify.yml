name: verify-source-artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SHA-256 manifests
        run: python3 scripts/verify_sources.py
      - name: Run synthetic D-LIQ r2 contract tests
        run: python3 tests/test_dliq_r2_synthetic.py
