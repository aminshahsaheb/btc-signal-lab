name: verify-source-artifacts

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run draft D-LIQ slots-builder unit tests
        run: python3 -m unittest discover -s research/d-liq/r3-tools -p 'test_*.py' -v
      - name: Verify SHA-256 manifests
        run: python3 scripts/verify_sources.py
