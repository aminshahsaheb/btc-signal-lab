name: Trend Setup v0 snapshot (public data; table and paper track)
# Triggered by a push that touches research/trend-setup/RUN_REQUEST.txt on a research/trend-setup-* branch. Prints the signal table for the last closed
# daily bar and the paper track since T0. A snapshot for attention and record-keeping; UNPROVEN. See specs/trend-setup/SETUP_TREND_v0.md section 4.
on:
  push:
    branches:
      - 'research/trend-setup-**'
    paths:
      - 'research/trend-setup/RUN_REQUEST.txt'
permissions:
  contents: read
concurrency:
  group: trend-setup-run
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numpy
        run: python -m pip install numpy==2.5.3
      - name: Frozen code hashes match CODE_SHA256.txt and the specification
        run: |
          cd research/trend-setup && sha256sum -c CODE_SHA256.txt && cd ../..
          for h in $(cut -d' ' -f1 research/trend-setup/CODE_SHA256.txt); do grep -q "$h" specs/trend-setup/SETUP_TREND_v0.md; done
      - name: Synthetic tests must pass first
        run: python -I -B research/trend-setup/test_trendsetup.py
      - name: Signal table for the last closed daily bar
        run: python -I -B research/trend-setup/trendsetup.py table --equity 10000 --out trendsetup_out
      - name: Paper track since T0
        run: python -I -B research/trend-setup/trendsetup.py paper --out trendsetup_out
      - name: Step summary
        if: always()
        run: |
          for f in trendsetup_out/table.md trendsetup_out/paper.md; do if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trendsetup-snapshot
          path: trendsetup_out/
          retention-days: 30
