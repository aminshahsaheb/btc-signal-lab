name: Zero-Pip Lab v1 fetch diagnostic (read-only; computes no result)
# Triggered by a push that touches research/zero-pip-lab/DIAG_REQUEST.txt on a research/zero-pip-* branch.
# It imports the frozen zeropip.py unchanged and only prints why public klines pass or fail the frozen validation.
on:
  push:
    branches:
      - 'research/zero-pip-**'
    paths:
      - 'research/zero-pip-lab/DIAG_REQUEST.txt'
permissions:
  contents: read
concurrency:
  group: zero-pip-diag
  cancel-in-progress: false
jobs:
  fetch-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numpy
        run: python -m pip install numpy==2.5.3
      - name: Frozen code hash still matches
        run: cd research/zero-pip-lab && sha256sum -c CODE_SHA256.txt
      - name: Fetch diagnostic (BTCUSDT and ETHUSDT)
        run: python -I -B research/zero-pip-lab/diag_fetch.py BTCUSDT ETHUSDT
