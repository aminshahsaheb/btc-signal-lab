name: Trend Setup v0 long-history structure check (public data)
# Triggered by a push that touches research/trend-setup/LONGHISTORY_REQUEST.txt on a research/trend-setup-* branch. Runs the FROZEN rule, unchanged, one market at a time on
# public daily history the lab never used for this rule (pre-registered in specs/trend-setup/PREREG_LONGHISTORY_v1.md). Descriptive; a pass is not evidence of future returns.
on:
  push:
    branches:
      - 'research/trend-setup-**'
    paths:
      - 'research/trend-setup/LONGHISTORY_REQUEST.txt'
permissions:
  contents: read
concurrency:
  group: trend-longhistory-run
  cancel-in-progress: false
jobs:
  longhistory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numpy
        run: python -m pip install numpy==2.5.3
      - name: Frozen code hashes match and the pre-registration names them
        run: |
          cd research/trend-setup && sha256sum -c CODE_SHA256.txt && sha256sum -c CODE_SHA256_LONGHISTORY.txt && cd ../..
          for h in $(cut -d' ' -f1 research/trend-setup/CODE_SHA256.txt research/trend-setup/CODE_SHA256_LONGHISTORY.txt); do grep -q "$h" specs/trend-setup/PREREG_LONGHISTORY_v1.md; done
      - name: Synthetic tests must pass first
        run: |
          python -I -B research/trend-setup/test_trendsetup.py
          python -I -B research/trend-setup/test_longhistory_report.py
      - name: Long-history structure check
        run: python -I -B research/trend-setup/longhistory_report.py --out longhistory_out
      - name: Step summary
        if: always()
        run: if [ -f longhistory_out/longhistory.md ]; then cat longhistory_out/longhistory.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-longhistory
          path: longhistory_out/
          retention-days: 30
