name: Trend Setup v0 descriptive backtest (public data)
# Triggered by a push that touches research/trend-setup/BACKTEST_REQUEST.txt on a research/trend-setup-* branch. Runs the FROZEN rule over the whole public
# daily history and prints a descriptive report. In-sample description, not evidence. See research/trend-setup/backtest_report.py.
on:
  push:
    branches:
      - 'research/trend-setup-**'
    paths:
      - 'research/trend-setup/BACKTEST_REQUEST.txt'
permissions:
  contents: read
concurrency:
  group: trend-backtest-run
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numpy
        run: python -m pip install numpy==2.5.3
      - name: Frozen code hashes match CODE_SHA256.txt and the specification
        run: |
          cd research/trend-setup && sha256sum -c CODE_SHA256.txt && cd ../..
          for h in $(cut -d' ' -f1 research/trend-setup/CODE_SHA256.txt); do grep -q "$h" specs/trend-setup/SETUP_TREND_v0.md; done
      - name: Synthetic tests must pass first
        run: |
          python -I -B research/trend-setup/test_trendsetup.py
          python -I -B research/trend-setup/test_backtest_report.py
      - name: Backtest
        run: python -I -B research/trend-setup/backtest_report.py --out backtest_out
      - name: Step summary
        if: always()
        run: if [ -f backtest_out/backtest.md ]; then cat backtest_out/backtest.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-backtest
          path: backtest_out/
          retention-days: 30
