name: Trend Setup v0 synthetic verification
on:
  pull_request:
    paths:
      - 'research/trend-setup/**'
      - 'specs/trend-setup/**'
      - 'tools/trend-ensemble/**'
      - '.github/workflows/verify-trend-setup.yml'
  push:
    branches:
      - main
    paths:
      - 'research/trend-setup/**'
      - 'specs/trend-setup/**'
      - 'tools/trend-ensemble/**'
      - '.github/workflows/verify-trend-setup.yml'
permissions:
  contents: read
concurrency:
  group: trend-setup-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numpy
        run: python -m pip install numpy==2.5.3
      - name: Frozen code hashes match CODE_SHA256.txt
        working-directory: research/trend-setup
        run: sha256sum -c CODE_SHA256.txt
      - name: Specification states the same hashes
        run: |
          for h in $(cut -d' ' -f1 research/trend-setup/CODE_SHA256.txt); do
            grep -q "$h" specs/trend-setup/SETUP_TREND_v0.md
          done
      - name: Synthetic tests (no network; same author as the code, not independent evidence)
        run: |
          python -I -B research/trend-setup/test_trendsetup.py
          python -I -B research/trend-setup/test_backtest_report.py
          python -I -B research/trend-setup/test_robustness_report.py
          python -I -B research/trend-setup/test_longhistory_report.py
          python -I -B research/trend-setup/test_frequency_report.py
