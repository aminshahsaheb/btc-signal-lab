name: D-LIQ G-2 draft (candidate independent SLOT replay) synthetic verification
on:
  pull_request:
    paths:
      - 'research/d-liq/g2-replay-draft/**'
      - 'research/d-liq/r5-draft/src/**'
      - '.github/workflows/verify-dliq-g2-replay-draft.yml'
  push:
    branches:
      - main
    paths:
      - 'research/d-liq/g2-replay-draft/**'
      - 'research/d-liq/r5-draft/src/**'
      - '.github/workflows/verify-dliq-g2-replay-draft.yml'
permissions:
  contents: read
concurrency:
  group: dliq-g2-replay-draft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests-and-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the package manifest
        working-directory: research/d-liq/g2-replay-draft
        run: sha256sum -c MANIFEST.sha256
      - name: Clean-room suite and supplementary suite (exact counts)
        working-directory: research/d-liq/g2-replay-draft
        run: |
          python -I -B src/test_replay_indep.py > "$RUNNER_TEMP/clean_room.txt" 2>&1
          cat "$RUNNER_TEMP/clean_room.txt"
          grep -q '^Ran 188 tests' "$RUNNER_TEMP/clean_room.txt"
          python -I -B src/test_replay_indep_supplement.py 2> "$RUNNER_TEMP/supplement.txt"
          cat "$RUNNER_TEMP/supplement.txt"
          grep -q '^Ran 3 tests' "$RUNNER_TEMP/supplement.txt"
      - name: Differential replay vs the author's verifier (seeds 11-14, 4000 journals each; exit status and exact summary)
        working-directory: research/d-liq/g2-replay-draft
        run: |
          for seed in 11 12 13 14; do
            python -I -B tools/diff_replay.py ../r5-draft/src src "$seed" 4000 > "$RUNNER_TEMP/diff_$seed.txt"
            head -1 "$RUNNER_TEMP/diff_$seed.txt"
            grep -q '"n": 4000,' "$RUNNER_TEMP/diff_$seed.txt"
            grep -q '"disagreements": 0}$' "$RUNNER_TEMP/diff_$seed.txt"
          done
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mutation check of the independent replay (every survivor must be in the reviewed list)
        working-directory: research/d-liq/g2-replay-draft
        run: |
          python -I -B tools/mutate_indep.py . ../r5-draft/src 4 > "$RUNNER_TEMP/mutation.txt"
          tail -3 "$RUNNER_TEMP/mutation.txt"
          grep -q '"mutants": 279,' "$RUNNER_TEMP/mutation.txt"
          grep -q '"unreviewed": 0, "stale": 0}$' "$RUNNER_TEMP/mutation.txt"
