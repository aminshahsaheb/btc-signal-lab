name: D-LIQ r4-draft synthetic verification
on:
  pull_request:
    paths:
      - 'research/d-liq/r4-draft/**'
      - '.github/workflows/verify-dliq-r4-draft.yml'
      - 'scripts/check_dliq_strict.sh'
  push:
    branches:
      - main
    paths:
      - 'research/d-liq/r4-draft/**'
      - '.github/workflows/verify-dliq-r4-draft.yml'
      - 'scripts/check_dliq_strict.sh'
permissions:
  contents: read
concurrency:
  group: dliq-r4-draft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify r4-draft manifest
        working-directory: research/d-liq/r4-draft
        run: sha256sum -c MANIFEST.sha256
      - name: Primary writer and verifier tests
        working-directory: research/d-liq/r4-draft
        run: python -I src/test_dliq_journal_v2.py
      - name: Partially independent verifier tests
        working-directory: research/d-liq/r4-draft
        run: python -I indep_verifier/test_indep.py
      - name: Message-contract tests
        working-directory: research/d-liq/r4-draft
        run: python -I src/test_dliq_msg_contract_v1.py
      - name: NONE-SLOT regressions
        working-directory: research/d-liq/r4-draft
        run: python -I tests/test_none_slot_regressions.py
      - name: Builder end-to-end tests (real journals, mandatory SLOT replay)
        working-directory: research/d-liq/r4-draft
        run: python -I -W ignore builder/test_build_slots_v2_e2e.py
      - name: Deliberate-bug (mutation) checks and four-seed differential corpus (strict runner)
        # scripts/check_dliq_strict.sh fails on a non-zero exit status, a survivor, a wrong killed-mutant count (15 expected),
        # a disagreement, or a corpus smaller than requested. Piping to tee under the default `bash -e` shell would have hidden a crash.
        run: bash scripts/check_dliq_strict.sh research/d-liq/r4-draft 15 30000 11 12 13 14
